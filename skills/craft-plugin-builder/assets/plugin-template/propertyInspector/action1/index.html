<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Craft Text Card</title>
    <style>
        body { margin: 16px; background: #282828; color: #eee; font: 13px Arial, sans-serif; }
        label { display: block; margin: 14px 0; }
        input { display: block; margin-top: 6px; box-sizing: border-box; width: 100%; }
        input[type=text] { padding: 8px; background: #383838; color: white; border: 1px solid #666; }
        input[type=color] { height: 32px; }
    </style>
</head>
<body>
    <label><span data-label="text">Text</span><input id="text" type="text"></label>
    <label><span data-label="bgColor">Background</span><input id="bgColor" type="color"></label>
    <label><span data-label="textColor">Text color</span><input id="textColor" type="color"></label>
    <script src="../utils/qwebchannel.js"></script>
    <script src="../utils/qt-webchannel.js"></script>
    <script src="../utils/action.js"></script>
    <script src="index.js"></script>
</body>
</html>
